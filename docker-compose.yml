services:
  votein:
    build: .
    container_name: votein
    restart: unless-stopped
    ports:
      - "3100:3000"
    networks:
      - traefik_proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_proxy"
      - "traefik.http.routers.votein.rule=Host(`${VOTEIN_HOST:-votein.dev.wandergeek.org}`)"
      - "traefik.http.routers.votein.entrypoints=websecure"
      - "traefik.http.routers.votein.tls.certresolver=letsencrypt"
      - "traefik.http.services.votein.loadbalancer.server.port=3000"

networks:
  traefik_proxy:
    external: true
